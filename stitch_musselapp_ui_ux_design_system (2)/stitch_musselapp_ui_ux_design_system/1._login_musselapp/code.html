<span class="material-symbols-outlined text-[24px]">expand_more</span>

</div>

        ACTIVAR
      </button>
</div>
<!-- Regulatory Compliance & Industrial Safety Footer -->

</div>
</div>
<script>
  // Simple micro-interactions for tactile field feedback
  document.addEventListener('DOMContentLoaded', () => {
    // Role selection chip state
    const roleChips = document.querySelectorAll('.role-chip');
    roleChips.forEach(chip => {
      chip.addEventListener('click', () => {
        roleChips.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-primary', 'text-on-primary');
          c.classList.add('bg-surface-container', 'text-on-surface');
          const icon = c.querySelector('.material-symbols-outlined');
          if (icon) icon.classList.add('text-secondary');
        });
        chip.setAttribute('aria-checked', 'true');
        chip.classList.remove('bg-surface-container', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary');
        const activeIcon = chip.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.classList.remove('text-secondary');
      });
    });

    // Toggle Password Visibility
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('input-password');
    const pwdIcon = document.getElementById('pwd-icon');
    
    if (togglePwdBtn && pwdInput && pwdIcon) {
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Submit Action Tactile Feedback
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px] animate-spin">sync</span>
          <span class="font-label-lg text-label-lg tracking-wider font-bold">VERIFICANDO CREDENCIAL...</span>
        `;
        submitBtn.disabled = true;
        setTimeout(() => {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }, 1200);
      });
    }
  });
</script></main>
